name: tests

# gdUnit4 publica un action oficial (gdUnit4-action), pero descarga su propia copia
# del framework y aquí ya viaja en el repo (addons/gdUnit4, versión 6.1.3). Descargar
# el binario a mano evita esa doble instalación y deja el proceso a la vista.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gdunit4:
    name: Tests de lógica de combate
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Cachear el binario de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}
        env:
          GODOT_VERSION: 4.7.1

      - name: Descargar Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        env:
          GODOT_VERSION: 4.7.1
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          BASE="https://github.com/godotengine/godot/releases/download"
          FILE="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL -o /tmp/godot.zip "${BASE}/${GODOT_VERSION}-stable/${FILE}.zip"
          unzip -q /tmp/godot.zip -d /tmp
          mv "/tmp/${FILE}" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Añadir Godot al PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      # Sin este paso el registro de `class_name` no existe y los tests fallan con
      # "Could not find type". No es opcional en un checkout limpio: .godot/ está
      # en .gitignore, así que en CI nunca viene hecho.
      - name: Importar recursos
        run: godot --path . --headless --import

      - name: Verificar que el proyecto carga
        run: godot --path . --headless --quit

      # --ignoreHeadlessMode es obligatorio: gdUnit4 aborta en headless por defecto
      # porque los InputEvent no se propagan sin ventana. La lógica de combate no
      # toca UI, así que aquí no aplica. Ver CLAUDE.md.
      - name: Correr tests
        run: |
          godot --path . --headless \
            -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode \
            -a test/

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit4-report
          path: reports/
          if-no-files-found: ignore
